<main>
  <section class="topSection">
    <h1>Find what's the weather like near you!</h1>
  </section>

  <section class="mainSection">
    <div class="inputDiv">
      <h3>Type below your target location.</h3>
      <input
        type="text"
        placeholder="Your target location name..."
        [(ngModel)]="findUserLocation" id="findUserLocation">
      <button (click)="searchWeather()" id="findUserLocation">Search</button>
    </div>

    <div class="outputDiv">
      <app-weather-display-component [location]="findUserLocation"></app-weather-display-component>
    </div>
  </section>
</main>
